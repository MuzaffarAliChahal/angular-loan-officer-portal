<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">L</span> Loan Officer Portal</div>
    @for (item of nav; track item.path) {
      <a class="nav-link" [routerLink]="item.path" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.exact }">{{ item.label }}</a>
    }
    <div class="sidebar-foot">Angular 21 · Spring Boot API</div>
  </aside>

  <main class="main">
    @if (mode === 'demo') {
      <div class="demo-banner">
        Demo mode: the decision rules run in your browser with sample data. Connect it to the Spring Boot
        <strong>loan-assessment-api</strong> for real persistence.
      </div>
    }
    <router-outlet />
  </main>
</div>
